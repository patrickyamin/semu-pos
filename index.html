<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Semu POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="Offline-first point of sale for the SEMU booth.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SEMU POS">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6.4 8h11.2l.9 12H5.5L6.4 8z"/><path d="M9.2 8.6V6.4a2.8 2.8 0 0 1 5.6 0v2.2"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.3 10.6a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L20.5 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M20 7h-8M14 17H4"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.8-3.8"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9 5.5l6.5 6.5L9 18.5"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M15 5.5L8.5 12l6.5 6.5"/></symbol>
    <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="M5.5 9l6.5 6.5L18.5 9"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.8l4.6 4.6L19 7"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3.2v12"/><path d="M8.2 6.6L12 2.8l3.8 3.8"/><path d="M7 10.5H5.6A1.6 1.6 0 0 0 4 12.1v7.3A1.6 1.6 0 0 0 5.6 21h12.8a1.6 1.6 0 0 0 1.6-1.6v-7.3a1.6 1.6 0 0 0-1.6-1.6H17"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M7 9.5V3.5h10v6"/><rect x="4" y="9.5" width="16" height="7.5" rx="2.2"/><path d="M7 15h10v5.5H7z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11.5" height="11.5" rx="2.4"/><path d="M5.2 15H4.3A1.3 1.3 0 0 1 3 13.7V4.3A1.3 1.3 0 0 1 4.3 3h9.4A1.3 1.3 0 0 1 15 4.3v.9"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.6c0 4.4-4 8-9 8a9.9 9.9 0 0 1-2.9-.4L5 20.5l1-3.6A7.7 7.7 0 0 1 3 11.6c0-4.4 4-8 9-8s9 3.6 9 8z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V5.2c0-.7.5-1.2 1.2-1.2h2.6c.7 0 1.2.5 1.2 1.2V7"/><path d="M6.2 7l.9 12.1c0 .6.5 1.1 1.1 1.1h7.6c.6 0 1.1-.5 1.1-1.1L18 7"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4.2L20 8.2a2.1 2.1 0 0 0-3-3L5.2 17 4 20z"/><path d="M14.5 6.5l3 3"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.4"/><circle cx="9" cy="10" r="1.6"/><path d="M4.5 18l4.8-4.8 3.7 3.7 3-3L20 18"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 20h1.5v1.5H20zM14 20h3M20 14h1.5"/></symbol>
    <symbol id="i-cash" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.2"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9.5v5M17.5 9.5v5"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.6"/><path d="M2.5 10h19M6 14.5h4"/></symbol>
    <symbol id="i-transfer" viewBox="0 0 24 24"><path d="M7 20V5.5M7 5.5L4 8.5M7 5.5l3 3"/><path d="M17 4v14.5M17 18.5l3-3M17 18.5l-3-3"/></symbol>
    <symbol id="i-bluetooth" viewBox="0 0 24 24"><path d="M7.2 7.3l9.6 9.4-4.8 4V3.3l4.8 4-9.6 9.4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v11.5M8.2 11.2L12 15l3.8-3.8"/><path d="M4 20.5h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20.5V9M8.2 12.8L12 9l3.8 3.8"/><path d="M4 3.5h16"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.4l9.3 16.6H2.7L12 3.4z"/><path d="M12 10v4.6M12 17.6v.1"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.4M12 7.7v.1"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.2h2.8L8.4 6h7.2l1.6 2.2H20a1 1 0 0 1 1 1v9.2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.2a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.8" r="3.4"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.4 12.6L12.6 3.4H21v8.4l-9.2 9.2a1.6 1.6 0 0 1-2.3 0l-6.1-6.1a1.6 1.6 0 0 1 0-2.3z"/><circle cx="16.4" cy="7.6" r="1.4"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M12 3.2l8.2 4.6v8.4L12 20.8l-8.2-4.6V7.8L12 3.2z"/><path d="M3.8 7.8L12 12.4l8.2-4.6M12 20.8v-8.4"/></symbol>
    <symbol id="i-del" viewBox="0 0 24 24"><path d="M9 5.5h10a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H9L3 12l6-6.5z"/><path d="M12.4 9.8l4.4 4.4M16.8 9.8l-4.4 4.4"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3.5h8L19 8.5v12H6z"/><path d="M13.5 3.5v5.2H19"/><path d="M9 13h6M9 16.4h4"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></symbol>
  </defs>
</svg>

<div id="app">

  <main id="screens">

    <section class="screen" id="screen-sell" data-tab="sell">
      <header class="screen-header">
        <div class="header-bar">
          <span class="header-inline">Sell</span>
          <div class="header-actions">
            <button class="text-btn" id="sell-manage" type="button">Products</button>
          </div>
        </div>
        <h1 class="header-large">Sell</h1>
      </header>

      <div class="screen-body">
        <div class="search-field">
          <svg class="ico"><use href="#i-search"/></svg>
          <input id="search-input" type="search" placeholder="Search products" autocomplete="off" enterkeyhint="search" aria-label="Search products">
          <button class="search-clear" id="search-clear" type="button" hidden aria-label="Clear search"><svg class="ico"><use href="#i-x"/></svg></button>
        </div>

        <div class="chip-row" id="category-chips"></div>

        <div class="grid" id="product-grid"></div>

        <div class="empty-state" id="sell-empty" hidden>
          <div class="empty-icon"><svg class="ico"><use href="#i-bag"/></svg></div>
          <h3>No products yet</h3>
          <p>Add your first product to start selling.</p>
          <button class="btn btn-primary" id="sell-add-first" type="button">Add product</button>
        </div>
      </div>
    </section>

    <section class="screen" id="screen-cart" data-tab="cart" hidden>
      <header class="screen-header">
        <div class="header-bar">
          <span class="header-inline">Cart</span>
          <div class="header-actions">
            <button class="text-btn is-destructive" id="cart-clear" type="button" hidden>Clear</button>
          </div>
        </div>
        <h1 class="header-large">Cart</h1>
      </header>

      <div class="screen-body" id="cart-body">
        <div class="empty-state" id="cart-empty">
          <div class="empty-icon"><svg class="ico"><use href="#i-cart"/></svg></div>
          <h3>Cart is empty</h3>
          <p>Tap a product to add it here.</p>
          <button class="btn btn-tinted" id="cart-go-sell" type="button">Browse products</button>
        </div>
        <div id="cart-content" hidden>
          <div class="list" id="cart-list"></div>
          <div class="list" id="cart-discount-row"></div>
          <div class="list" id="cart-summary"></div>
        </div>
      </div>

      <div class="sticky-cta" id="cart-cta" hidden>
        <button class="btn btn-primary btn-xl" id="checkout-btn" type="button">Checkout</button>
      </div>
    </section>

    <section class="screen" id="screen-reports" data-tab="reports" hidden>
      <header class="screen-header">
        <div class="header-bar">
          <span class="header-inline">Reports</span>
          <div class="header-actions">
            <button class="text-btn" id="export-csv" type="button">Export</button>
          </div>
        </div>
        <h1 class="header-large">Reports</h1>
      </header>
      <div class="screen-body" id="report-body"></div>
    </section>

    <section class="screen" id="screen-settings" data-tab="settings" hidden>
      <header class="screen-header">
        <div class="header-bar">
          <span class="header-inline">Settings</span>
        </div>
        <h1 class="header-large">Settings</h1>
      </header>
      <div class="screen-body" id="settings-body"></div>
    </section>

  </main>

  <button class="cartbar" id="cartbar" type="button" hidden>
    <span class="cartbar-count" id="cartbar-count">0</span>
    <span class="cartbar-label">View cart</span>
    <span class="cartbar-total" id="cartbar-total"></span>
  </button>

  <nav id="tabbar" aria-label="Main">
    <button class="tab" data-tab="sell" type="button" aria-label="Sell">
      <span class="tab-ico"><svg class="ico"><use href="#i-bag"/></svg></span>
      <span class="tab-label">Sell</span>
    </button>
    <button class="tab" data-tab="cart" type="button" aria-label="Cart">
      <span class="tab-ico"><svg class="ico"><use href="#i-cart"/></svg><span class="badge" id="tab-badge" hidden>0</span></span>
      <span class="tab-label">Cart</span>
    </button>
    <button class="tab" data-tab="reports" type="button" aria-label="Reports">
      <span class="tab-ico"><svg class="ico"><use href="#i-chart"/></svg></span>
      <span class="tab-label">Reports</span>
    </button>
    <button class="tab" data-tab="settings" type="button" aria-label="Settings">
      <span class="tab-ico"><svg class="ico"><use href="#i-settings"/></svg></span>
      <span class="tab-label">Settings</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="dialog-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <div id="overlay-root"></div>
  <div id="onboarding" hidden></div>

</div>

<script src="catalog.js"></script>
<script src="app.js"></script>






</body>
</html>
